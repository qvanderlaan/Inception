networks:
    inception:
        name: inception

volumes:
    mariadb_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/qvan-der/data/mariadb

    wordpress_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/qvan-der/data/wordpress

services:
    mariadb:
        container_name: mariadb
        build: ./requirements/mariadb
        restart: always
        env_file:
            - .env
        volumes:
            - mariadb_data:/var/lib/mysql
        networks:
            - inception
        expose:
            - 3306

    wordpress:
        container_name: wordpress
        build: ./requirements/wordpress
        restart: always
        depends_on:
            - mariadb
        env_file:
            - .env
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        expose:
            - 9000
