networks:
    inception:
        name: inception

volumes:
    mariadb_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/qvan-der/data/mariadb

    wordpress_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/qvan-der/data/wordpress

secrets:
    db_root_password:
        file: ../secrets/db_root_password.txt
    db_password:
        file: ../secrets/db_password.txt
    credentials:
        file: ../secrets/credentials.txt

services:
    mariadb:
        container_name: mariadb
        image: mariadb
        build: ./requirements/mariadb
        restart: always
        env_file:
            - .env
        secrets:
            - db_root_password
            - db_password
        volumes:
            - mariadb_data:/var/lib/mysql
        networks:
            - inception
        expose:
            - 3306

    wordpress:
        container_name: wordpress
        image: wordpress
        build: ./requirements/wordpress
        restart: always
        depends_on:
            - mariadb
        env_file:
            - .env
        secrets:
            - db_password
            - credentials
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        expose:
            - 9000

    nginx:
        container_name: nginx
        image: nginx
        build: ./requirements/nginx
        restart: always
        depends_on:
            - wordpress
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        ports:
            - "443:443"
